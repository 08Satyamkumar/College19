<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Premium 3D Multi-stop Sunset Orange Gradient -->
    <linearGradient id="c19Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A38"/>
      <stop offset="45%" stop-color="#F05A28"/>
      <stop offset="100%" stop-color="#BD3000"/>
    </linearGradient>

    <!-- Subtle Radial Glow in Center -->
    <radialGradient id="c19Glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow for 3D Elements -->
    <filter id="c19Shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="1.8" flood-opacity="0.32" flood-color="#7A1800"/>
    </filter>
  </defs>

  <!-- Squircle Base with 3D Depth -->
  <rect width="100" height="100" rx="24" fill="url(#c19Bg)"/>
  <rect width="100" height="100" rx="24" fill="url(#c19Glow)"/>

  <!-- Inner Glass Accent Border -->
  <rect x="3" y="3" width="94" height="94" rx="21" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="2"/>

  <!-- Graduation Cap (Mortarboard) -->
  <g filter="url(#c19Shadow)">
    <!-- Top Diamond Plane -->
    <path d="M50 14 L84 27.5 L50 41 L16 27.5 Z" fill="#FFFFFF"/>
    <!-- Lower Cap Headband -->
    <path d="M28 35.5 C28 35.5 35 47.5 50 47.5 C65 47.5 72 35.5 72 35.5 V39 C72 47.5 65 51.5 50 51.5 C35 51.5 28 47.5 28 39 Z" fill="#FFFFFF" fill-opacity="0.96"/>
    <!-- Golden Silk Tassel -->
    <path d="M72 29.5 C76 33.5 78.5 39 77.5 44" stroke="#FFD54F" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="77.5" cy="45" r="2.4" fill="#FFD54F"/>
  </g>

  <!-- Bold, Punchy "C19" Monogram -->
  <g filter="url(#c19Shadow)">
    <text x="50" y="83.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Outfit', 'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" text-anchor="middle" letter-spacing="-1">C19</text>
  </g>
</svg>
